spring.application.name=ecomerce
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:advancejava}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# DEV ONLY: override APP_JWT_SECRET (32+ bytes) in every non-local environment.
app.jwt.secret=${APP_JWT_SECRET:dev-only-jwt-secret-change-me-1234567890}
app.jwt.expiration=86400000

# Comma-separated exact origins allowed to call the API with credentials.
# The deployed frontend is included so a fresh deployment works out of the box.
# Override CORS_ALLOWED_ORIGINS in any environment that uses different domains.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://diskart.vercel.app}

# Razorpay test placeholders. Override RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET in
# every real environment. While the key id is this placeholder the backend runs
# in demo mode: no external HTTP call is made and dummy verify values are accepted.
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_your_key_id}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:your_test_secret}
razorpay.api.url=https://api.razorpay.com/v1

# Development-only admin bootstrap (disabled automatically under the "prod" profile).
app.seed.enabled=${APP_SEED_ENABLED:true}
app.seed.admin.email=${APP_SEED_ADMIN_EMAIL:admin@diskart.local}
app.seed.admin.password=${APP_SEED_ADMIN_PASSWORD:change-me-dev-only}

server.port=${PORT:8080}
