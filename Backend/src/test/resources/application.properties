spring.datasource.url=jdbc:h2:mem:diskart_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

app.jwt.secret=test-only-jwt-secret-key-at-least-32-bytes-long
app.jwt.expiration=86400000
app.cors.allowed-origins=http://localhost:3000
app.seed.enabled=false

# Test placeholders: demo mode, no external HTTP calls.
razorpay.key.id=rzp_test_your_key_id
razorpay.key.secret=your_test_secret
razorpay.api.url=https://api.razorpay.com/v1
